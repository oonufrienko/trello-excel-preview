name: e2e

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC — catches Trello/SheetJS-side breakage without
    # an active PR. Off-peak time keeps Trello rate-limit headroom.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# Every run seeds and mutates the same Trello test board, so runs must not
# overlap. cancel-in-progress stays false on purpose: a run killed mid-suite
# leaves the board dirty (that is how the orphan renamed-*.csv attachments
# accumulated), so we queue instead of cancelling. queue: max because the
# default (single) keeps just one run pending and cancels it when the next
# one arrives — with two open PRs the first one's check would go cancelled.
concurrency:
  group: trello-test-board
  cancel-in-progress: false
  queue: max

jobs:
  # Job name must stay "e2e" — the ruleset-for-main required status
  # check matches on the job name, not the workflow name.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Project identifiers (not secrets) — let the Vercel CLI work without a
      # local .vercel/ directory.
      VERCEL_ORG_ID: team_i8VbzTWKRuzPhOtsS49yRAgi
      VERCEL_PROJECT_ID: prj_Ie3XBspzfh7eMheHHxTu6fx3frhV
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore storageState.json
        run: |
          # tr strips CR/LF/spaces a Windows clipboard or editor may have
          # added to the secret; base64 -d chokes on them otherwise.
          printf '%s' "$TRELLO_STORAGE_STATE_B64" | tr -d '[:space:]' | base64 -d > ./storageState.json
          test -s ./storageState.json
        env:
          TRELLO_STORAGE_STATE_B64: ${{ secrets.TRELLO_STORAGE_STATE_B64 }}

      - name: Generate synthetic fixtures
        run: npm run generate-fixtures

      - name: Seed test board
        run: npm run seed-board
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_USER_TOKEN: ${{ secrets.TRELLO_USER_TOKEN }}
          TRELLO_TEST_BOARD_ID: ${{ secrets.TRELLO_TEST_BOARD_ID }}

      # On a PR, test the PR's own code: deploy it and point the suite at that
      # build via PREVIEW_HOST. Without this the suite would exercise whatever
      # the dev alias happens to serve, so a green check would say nothing
      # about the change under review.
      #
      # --prod --skip-domain, not a plain preview deploy: Vercel injects its
      # toolbar script (vercel.live) into preview-environment deployments, our
      # CSP blocks it, and preview.spec's "no CSP violations" assertion then
      # fails on every run. --skip-domain keeps the production domain pointing
      # at whatever it serves now, so this stages a build without shipping it.
      - name: Stage build for this PR
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          # Both --yes matter: the first stops npx asking before it installs
          # the package, the second stops the Vercel CLI's own prompts.
          url=$(npx --yes vercel@58.1.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The nightly run deliberately leaves PREVIEW_HOST empty: it checks what
      # the dev alias actually serves, not a fresh build.
      - name: Run Playwright
        run: |
          host="${{ steps.preview.outputs.url }}"
          PREVIEW_HOST="${host#https://}" npx playwright test
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_USER_TOKEN: ${{ secrets.TRELLO_USER_TOKEN }}
          TRELLO_TEST_BOARD_ID: ${{ secrets.TRELLO_TEST_BOARD_ID }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
